<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization Code — Tiny Space, Tidy Place</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#FDFBF7;color:#222;margin:0}
  .wrap{max-width:640px;margin:0 auto;padding:64px 24px}
  h1{font-family:Georgia,serif}
  .codebox{background:#fff;border:2px solid #0f766e;border-radius:12px;padding:20px;word-break:break-all;font-family:monospace;margin:16px 0}
  .ok{color:#0f766e;font-weight:bold}
  .err{color:#b91c1c;font-weight:bold}
  button{padding:10px 22px;border-radius:999px;border:none;background:#0f766e;color:#fff;cursor:pointer;font-size:.95rem}
  .hint{color:#666;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pinterest authorization</h1>
  <div id="out"><p class="hint">Waiting for Pinterest to redirect back here…</p></div>
</div>
<script>
(function(){
  var p = new URLSearchParams(window.location.search);
  var out = document.getElementById('out');
  var code = p.get('code'), err = p.get('error'), state = p.get('state');
  if (code) {
    out.innerHTML = '<p class="ok">Got it! Copy your authorization code below:</p>'
      + '<div class="codebox" id="cb">'+code.replace(/</g,'&lt;')+'</div>'
      + '<button onclick="navigator.clipboard.writeText(document.getElementById(\'cb\').textContent);this.textContent=\'Copied!\'">Copy code</button>'
      + (state ? '<p class="hint">state: '+state.replace(/</g,'&lt;')+'</p>' : '')
      + '<p class="hint">This code expires in about 10 minutes. Exchange it for an access token right away.</p>';
  } else if (err) {
    out.innerHTML = '<p class="err">Authorization failed: '+err.replace(/</g,'&lt;')+'</p><p class="hint">'+(p.get('error_description')||'').replace(/</g,'&lt;')+'</p>';
  }
})();
</script>
</body>
</html>
